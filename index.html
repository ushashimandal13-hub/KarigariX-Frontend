<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KarigariX</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>
    <!-- LANDING PAGE -->
    <main class="landing">


        <!-- LEFT SIDE -->
        <section class="landing-content">

            <div class="content-wrapper">


                <!-- Small heading -->

                <div class="portal-label">

                    <span class="label-line"></span>

                    <span>
                        ARTIST PORTAL
                    </span>

                </div>



                <!-- Main heading -->

                <h1>

                    Your craft.
                    <br>

                    <em>Your story.</em>

                </h1>



                <!-- Description -->

                <p class="landing-description">

                    Manage your registered products,
                    create digital product passports,
                    and generate QR codes for your crafts.

                </p>

                <form id="loginForm">

    <label for="email">
        Email Address
    </label>

    <div class="email-box">

        <input
            type="email"
            id="email"
            placeholder="artist@example.com"
            required
        >

        <button type="submit">
            Continue to Dashboard →
        </button>

    </div>

</form>
                <!-- Bottom trust message -->

                <div class="trust-message">

                    <span class="trust-icon">
                        ♢
                    </span>

                    <span>
                        Your product stories, kept with care.
                    </span>

                </div>


            </div>

        </section>
        <!--
             RIGHT SIDE IMAGE
        -->
        <section class="hero-image">

            <img
                src="./images/Bandhani-Tie-Dye.webp"
                alt="Traditional Bandhani tie-dye craft"
            >


            <!-- Dark image overlay -->

            <div class="image-overlay"></div>



            <!-- Image text -->

            <div class="image-text">


                <small>
                    INDIA · A STORY WORTH PRESERVING
                </small>


                <h2>
                    Made by hand,
                    <br>
                    kept forever.
                </h2>


                <p>
                    Traditional Bandhani Craft
                </p>


            </div>


        </section>

    </main>

    <!-- JavaScript -->

    <script src="script.js"></script>

    
</body>
</html>
